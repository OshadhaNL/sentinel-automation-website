[pytest]
markers =
    ui: UI automation tests
    smoke: Smoke tests
    negative: Negative test scenarios
    positive: Positive test scenarios
    boundary: Tests at a documented validation limit
    readonly: Does not save QA business data; review fixtures block API writes
    workflow: Connected actions that verify persistence, identity, or recovery
    workflow_write: Opt-in workflows that create or modify disposable QA records
    performance: Measurements and explicitly budgeted response-time checks
    functional: Functional application tests
    document_write: Tests that upload, modify, or delete profile documents
    screening_write: Screening tests that may modify client data
    risk_write: Tests that modify a disposable individual's risk assessment
